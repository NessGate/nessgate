name: Publish @nessgate/inspect

# Tokenless publish to npm via GitHub Actions Trusted Publishing (OIDC), same
# arrangement as publish-resolver.yml. Nothing publishes automatically on push.
#
# First-time note: npm must have a trusted publisher configured for the
# @nessgate/inspect package (repository NessGate/nessgate, workflow
# publish-inspect.yml) before this job can publish.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for OIDC Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/inspect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing + provenance require a recent npm.
      - name: Update npm
        run: npm install -g npm@latest

      # The full deterministic gate must pass before anything is published.
      - name: Run the deterministic gate
        working-directory: .
        run: npm run gate

      - name: Show the OIDC claims npm receives (for trusted-publisher matching)
        working-directory: .
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq "{repository, repository_owner, workflow_ref, job_workflow_ref, ref, environment, sub}" || true

      - name: Publish (provenance, public, tokenless via OIDC)
        run: npm publish --provenance --access public
